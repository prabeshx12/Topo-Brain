# Training Configuration for Topology-Preserving 3T-to-7T MRI Enhancement
# Diffusion Model Training with Blueprint-aligned hyperparameters

dataset:
  pairs_csv: "pairs.csv"
  batch_size: 2  # Reduced for stability
  patch_size: [64, 64, 64]
  num_workers: 4

model:
  in_channels: 1
  cond_channels: 1
  out_channels: 1
  num_classes: 2
  features: [32, 64, 128, 256]
  dropout: 0.0  # Disable dropout for initial training

diffusion:
  timesteps: 1000
  beta_schedule: "cosine"  # Cosine is more stable for medical imaging
  loss_type: "l1"

training:
  lr: 2e-5  # Lower LR for stable diffusion training
  weight_decay: 1e-4
  grad_clip: 1.0  # Gradient clipping for stability
  n_iters: 200000
  save_freq: 1000
  val_freq: 1000
  log_freq: 50
  
  # EMA settings
  ema_decay: 0.9999
  ema_start: 2000
  
stages:
  # Curriculum learning stages (step-based)
  stage1_end: 10000   # Pure diffusion loss
  stage2_end: 50000   # Add pixel loss
  stage3_end: 100000  # Add perceptual loss
  # Stage 4 (100k+): Full multi-task with gradual topology warm-up

# Loss weights (final values for Stage 4)
# Rebalanced based on 100k iteration analysis
loss_weights:
  lambda_pixel: 0.05    # Reduced from 0.1 to prevent over-smoothing
  lambda_percep: 0.3    # Reduced from 0.5 to control grain
  lambda_topo: 0.3      # Increased from 0.1 for stronger anatomical guidance
  
  # Topology warm-up configuration
  topo_warmup_steps: 25000  # Gradual ramp from 0.0 to lambda_topo over 25k iterations
