# Training Configuration for Topology-Preserving 3T-to-7T MRI Enhancement
# Diffusion Model Training with Blueprint-aligned hyperparameters

dataset:
  pairs_csv: "/eos/home-i04/p/ppokhrel/Untitled Folder 1/tissue_masks/pairs_with_tissue_masks.csv"
  batch_size: 2  # Reduced for stability
  patch_size: [64, 64, 64]
  num_workers: 4
  use_t2: false # Multi-modal input support (Section 6.3)

model:
  in_channels: 1
  cond_channels: 1
  out_channels: 1
  num_classes: 4
  features: [32, 64, 128, 256]
  dropout: 0.0  # Disable dropout for initial training
  use_attention: false  # Toggles the 3D-Transformer/Global-Context modules

diffusion:
  timesteps: 1000
  beta_schedule: "cosine"  # Cosine is more stable for medical imaging
  loss_type: "l1"

training:
  lr: 1e-5  # Level 4.6: Low LR for final fine-tuning
  weight_decay: 1e-4
  grad_clip: 1.0  # Gradient clipping for stability
  n_iters: 200000
  save_freq: 1000
  val_freq: 1000
  log_freq: 50
  
  # EMA settings
  ema_decay: 0.9999
  ema_start: 2000
  
stages:
  # Curriculum learning stages (step-based)
  stage1_end: 10000   # Pure diffusion loss
  stage2_end: 50000   # Add pixel loss
  stage3_end: 100000  # Add perceptual loss
  # Stage 4 (100k+): Full multi-task with gradual topology warm-up

# Stage 4.7: Grain Removal & Smoothness Tuning
# Reduced weights to prevent over-driving the diffusion process with noisy gradients
loss_weights:
  lambda_pixel: 0.25    # High detergent to wash out noise
  lambda_percep: 0.1    # Reduced to prevent grid artifacts
  lambda_topo: 0.1      # Reduced (Guided, not Driven)
  
  # Topology warm-up configuration (Completed)
  topo_warmup_steps: 25000
