
dataset:
  pairs_csv: "pairs.csv"
  batch_size: 4
  patch_size: [64, 64, 64]
  num_workers: 8

model:
  in_channels: 1
  cond_channels: 1
  out_channels: 1
  num_classes: 3
  features: [32, 64, 128, 256]
  dropout: 0.1

diffusion:
  timesteps: 1000
  beta_schedule: "linear"
  loss_type: "l1" # L1 on noise is often sharper

training:
  lr: 1e-4
  n_iters: 200000
  save_freq: 1000
  val_freq: 1000
  log_freq: 100
  
stages:
  stage1_steps: 50000  # Structure
  stage2_steps: 150000 # Topology
