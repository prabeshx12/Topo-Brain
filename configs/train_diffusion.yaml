# Training Configuration for Topology-Preserving 3T-to-7T MRI Enhancement
# Diffusion Model Training with Blueprint-aligned hyperparameters

dataset:
  pairs_csv: "pairs.csv"
  batch_size: 2  # Reduced for stability
  patch_size: [64, 64, 64]
  num_workers: 4

model:
  in_channels: 1
  cond_channels: 1
  out_channels: 1
  num_classes: 3
  features: [32, 64, 128, 256]
  dropout: 0.0  # Disable dropout for initial training

diffusion:
  timesteps: 1000
  beta_schedule: "cosine"  # Cosine is more stable for medical imaging
  loss_type: "l1"

training:
  lr: 2e-5  # Lower LR for stable diffusion training
  weight_decay: 1e-4
  grad_clip: 1.0  # Gradient clipping for stability
  n_iters: 200000
  save_freq: 1000
  val_freq: 1000
  log_freq: 50
  
  # EMA settings
  ema_decay: 0.9999
  ema_start: 2000
  
stages:
  # Curriculum learning stages (step-based)
  stage1_end: 10000   # Pure diffusion loss
  stage2_end: 50000   # Add pixel loss
  stage3_end: 100000  # Add perceptual loss
